<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ਸ਼ਬਦ ਨੂੰ ਪੂਰਾ ਕਰੋ</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial, sans-serif;
  background:
    radial-gradient(circle at 15% 10%, #ff8acb, transparent 28%),
    radial-gradient(circle at 85% 15%, #78e7ff, transparent 30%),
    radial-gradient(circle at 50% 95%, #caa3ff, transparent 35%),
    linear-gradient(135deg,#fff3a3,#ffd6e8,#d9f7ff);
  overflow-x:hidden;
}
.topName{
  text-align:center;
  font-size:18px;
  font-weight:900;
  background:linear-gradient(90deg,#ffeb3b,#ff80ab,#80d8ff,#b9f6ca);
  padding:10px;
  position:sticky;
  top:0;
  z-index:50;
}
.bubble{
  position:fixed;
  border-radius:50%;
  opacity:.28;
  animation:float 7s infinite ease-in-out;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-35px)}
}
.wrap{max-width:950px;margin:auto;padding:15px;position:relative;z-index:2}
header{
  background:rgba(255,255,255,.9);
  border-radius:28px;
  padding:16px;
  text-align:center;
  box-shadow:0 14px 35px #0003;
}
h1{margin:0;font-size:30px;font-weight:900}
.top,.levelBtns{
  margin-top:12px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}
.pill,button{
  border:0;
  border-radius:999px;
  padding:10px 14px;
  font-weight:900;
  box-shadow:0 8px 18px #0002;
}
.pill{background:white}
button{cursor:pointer;color:white;background:linear-gradient(135deg,#111,#444)}
.levelBtns button{
  background:linear-gradient(135deg,#ff4081,#7c4dff);
}
.levelBtns button.active{
  background:linear-gradient(135deg,#00c853,#ffd600);
  color:#111;
}
.progressOuter{
  height:14px;
  background:#eee;
  border-radius:999px;
  margin-top:12px;
  overflow:hidden;
}
.progressInner{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00e676,#ffee58,#ff4081);
  transition:.3s;
}
.levelBox{
  margin-top:18px;
  background:rgba(255,255,255,.75);
  padding:15px;
  border-radius:26px;
  box-shadow:0 14px 30px #0002;
}
.levelTitle{text-align:center;font-size:24px;font-weight:900}
.q{
  margin-top:16px;
  border-radius:26px;
  padding:16px;
  position:relative;
  overflow:hidden;
  box-shadow:0 14px 28px #0003;
  border:3px solid rgba(255,255,255,.8);
  background:white;
}
.q:before{
  content:"";
  position:absolute;
  inset:-40px;
  background:conic-gradient(#ff408133,#40c4ff33,#ffeb3b33,#69f0ae33,#ea80fc33,#ff408133);
}
.qContent{position:relative;z-index:1}
.word{
  font-size:30px;
  font-weight:900;
  text-align:center;
  line-height:1.5;
}
.blank{
  display:inline-block;
  min-width:110px;
  border-bottom:5px solid #222;
  padding:4px 12px;
  border-radius:14px;
  background:#ffffffaa;
}
.choices{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  margin-top:16px;
}
.chip{
  font-size:22px;
  border-radius:15px;
  padding:10px 14px;
  border:0;
  cursor:pointer;
  color:#111;
}
.good{background:#8cffb5!important}
.bad{background:#ff1744!important;color:white!important}
.used{opacity:.45;pointer-events:none}
.msg{text-align:center;margin-top:15px;font-size:22px;font-weight:900}
.spark{
  position:fixed;
  width:10px;
  height:10px;
  border-radius:50%;
  pointer-events:none;
  z-index:99;
}
.shake{animation:shake .25s}
@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  50%{transform:translateX(6px)}
  75%{transform:translateX(-4px)}
  100%{transform:translateX(0)}
}
@media(max-width:600px){
  h1{font-size:25px}
  .word{font-size:25px}
  .chip{font-size:20px}
}
</style>
</head>

<body>

<div class="topName">kkdeol • Gsss • Dalla</div>

<div class="wrap">
<header>
  <h1>🌈 ਸ਼ਬਦ ਨੂੰ ਪੂਰਾ ਕਰੋ 🌈</h1>

  <div class="top">
    <div class="pill" id="levelPill">Level 1</div>
    <div class="pill" id="score">ਸਕੋਰ: 0</div>
    <div class="pill" id="progress">0/10</div>
    <button onclick="start()">Reset</button>
  </div>

  <div class="levelBtns" id="levelBtns"></div>

  <div class="progressOuter">
    <div class="progressInner" id="bar"></div>
  </div>
</header>

<div class="levelBox" id="levelBox">
  <div class="levelTitle" id="levelTitle">Level 1</div>
  <div id="game"></div>
  <div class="msg" id="msg">Ready ✅</div>
</div>
</div>

<script>
for(let i=0;i<45;i++){
 let b=document.createElement("div");
 b.className="bubble";
 let s=10+Math.random()*28;
 b.style.width=s+"px";
 b.style.height=s+"px";
 b.style.left=Math.random()*100+"vw";
 b.style.top=Math.random()*100+"vh";
 b.style.background=`hsl(${Math.random()*360},95%,65%)`;
 b.style.animationDelay=Math.random()*5+"s";
 document.body.appendChild(b);
}

const levels=[
[
 {pattern:"ਇ__ਸਾ ਨ",answer:"ਨ"},
 {pattern:"ਅੰਬਚੂ__",answer:"ਰ"},
 {pattern:"ਅਨਾ__ਦਾਣਾ",answer:"ਰ"},
 {pattern:"ਖ਼ੁਸ਼__",answer:"ਬੂ"},
 {pattern:"ਖ__ਆ ਈ",answer:"ਟਿ"},
 {pattern:"ਜਵੈ__",answer:"ਣ"},
 {pattern:"__ਦਨਾ",answer:"ਪੂ"},
 {pattern:"ਇਕੱ__",answer:"ਠੇ"},
 {pattern:"ਸੁਆ__",answer:"ਦ"},
 {pattern:"ਇਲਾ__",answer:"ਚੀ"}
],
[
 {pattern:"ਪਲਾ__ਟਿਕ",answer:"ਸ"},
 {pattern:"ਖ਼ਤਰਨਾ__",answer:"ਕ"},
 {pattern:"ਮਾ__ਟਰ",answer:"ਸ"},
 {pattern:"ਪ੍ਰਦੂਸ਼__",answer:"ਣ"},
 {pattern:"ਵਿਦਿਆ__ਥੀ",answer:"ਰ"},
 {pattern:"__ਫ਼ਾਫ਼ੇ",answer:"ਲਿ"},
 {pattern:"ਸ਼ਾਬਾ__",answer:"ਸ਼"},
 {pattern:"__ਮਾਰੀਆਂ",answer:"ਬਿ"},
 {pattern:"ਨਾਲ਼ੀ__",answer:"ਆਂ"},
 {pattern:"ਮੁੰਡਿ__",answer:"ਓ"}
],
[
 {pattern:"ਪੰ__ਬੀ",answer:"ਜਾ"},
 {pattern:"ਬੁਢਾ__",answer:"ਪੇ"},
 {pattern:"ਕੁ__ਆਂ",answer:"ੜੀ"},
 {pattern:"__ਵਾਨੀ",answer:"ਜ"},
 {pattern:"ਬਰੂ__",answer:"ਹਾਂ"},
 {pattern:"ਮ__ਆਰਾਂ",answer:"ਟਿ"},
 {pattern:"ਧਾਗਿ__",answer:"ਆਂ"},
 {pattern:"ਥਾ__",answer:"ਲ਼"},
 {pattern:"ਵਾ__ਵਰਨ",answer:"ਤਾ"},
 {pattern:"ਨ__ਨਾ",answer:"ਣਾਂ"}
],
[
 {pattern:"ਮਾ__ਲ",answer:"ਹੌ"},
 {pattern:"__ਮਾਨ",answer:"ਸ"},
 {pattern:"ਚੂੜੀ__",answer:"ਆਂ"},
 {pattern:"ਪ__ਡਰ",answer:"ਊ"},
 {pattern:"ਪਰਿ__ਰ",answer:"ਵਾ"},
 {pattern:"ਪੋਟ__",answer:"ਲ਼ੀ"},
 {pattern:"ਖ਼ਿ__ਲ",answer:"ਆ"},
 {pattern:"__ਰੰਕ",answer:"ਟ"},
 {pattern:"ਦੁੱ__",answer:"ਧ"},
 {pattern:"ਪਿਆ__",answer:"ਰ"}
],
[
 {pattern:"ਨਿ__ਣੇ",answer:"ਆ"},
 {pattern:"ਪ__ਣਾਂ",answer:"ਠਾ"},
 {pattern:"ਜਰਨੈ__",answer:"ਲੀ"},
 {pattern:"ਸਿਆ__",answer:"ਲ਼"},
 {pattern:"ਪਰ__ਸੀ",answer:"ਦੇ"},
 {pattern:"ਅੱਥ__",answer:"ਰੂ"},
 {pattern:"ਵਾਹਿ__ਰੂ",answer:"ਗੁ"},
 {pattern:"ਸਹਿ__",answer:"ਮ"},
 {pattern:"__ਹਾਣੀ",answer:"ਕ"},
 {pattern:"__ੜਕ",answer:"ਸ"}
],
[
 {pattern:"__ਲੇਰੀ",answer:"ਦ"},
 {pattern:"ਤਰਾ __",answer:"ਕੀ"},
 {pattern:"ਫ਼ੁ__ਬਾਲ",answer:"ਟ"},
 {pattern:"ਚੰਡੀ__ੜ੍ਹ",answer:"ਗ"},
 {pattern:"ਪਟਿਆ__",answer:"ਲ਼ੇ"},
 {pattern:"_ਖਨਾ",answer:"ਸੁ"},
 {pattern:"ਗਾ__ਡਨ",answer:"ਰ"},
 {pattern:"ਕਿਸ਼__",answer:"ਤੀ"},
 {pattern:"ਕੇਂ__ਰ",answer:"ਦ"},
 {pattern:"ਗਿਆ__",answer:"ਨ"}
],
[
 {pattern:"ਗ_ਮੀ",answer:"ਰ"},
 {pattern:"ਆ_ਣੀ",answer:"ਪ"},
 {pattern:"ਧ_ਤੀ",answer:"ਰ"},
 {pattern:"ਅ_ਮਾਨ",answer:"ਸ"},
 {pattern:"ਹੈਰਾ__",answer:"ਨ"},
 {pattern:"ਸਵਾ__",answer:"ਲ"},
 {pattern:"ਮੌਸ__",answer:"ਮ"},
 {pattern:"ਤਾ__",answer:"ਰੇ"},
 {pattern:"ਲੇਟਿ__",answer:"ਆ"},
 {pattern:"ਰਾ__",answer:"ਤ"}
],
[
 {pattern:"ਵਿਗਿ__ਨ",answer:"ਆ"},
 {pattern:"ਬਾ__",answer:"ਰੀ"},
 {pattern:"ਅਕਾ__",answer:"ਸ਼"},
 {pattern:"ਜ__ਜ਼",answer:"ਹਾ"},
 {pattern:"ਮੈ ਡ__",answer:"ਮ"},
 {pattern:"ਪੰ__",answer:"ਛੀ"},
 {pattern:"ਸੜ__",answer:"ਕ"},
 {pattern:"__ਲਣ",answer:"ਬਾ"},
 {pattern:"ਖੰ_",answer:"ਭ"},
 {pattern:"ਅੰ__ਰ",answer:"ਦ"}
],
[
 {pattern:"ਫ਼ਕੀ__",answer:"ਰ"},
 {pattern:"ਜੰ__ਲ",answer:"ਗ"},
 {pattern:"ਅਮੀ__",answer:"ਰ"},
 {pattern:"ਲੱ__ੜਾਂ",answer:"ਕ"},
 {pattern:"ਮਾਰੂ__ਲ",answer:"ਥ"},
 {pattern:"ਜ਼ਰਖੇ__",answer:"ਜ਼"},
 {pattern:"ਅਚਾਨ__",answer:"ਕ"},
 {pattern:"ਹ__ਰ",answer:"ਸ਼"},
 {pattern:"ਸ਼ਰ__ਸਾਰ",answer:"ਮ"},
 {pattern:"ਹਰਿਆਵ__",answer:"ਲ"}
],
[
 {pattern:"ਦਿਆਲ__ਗ",answer:"ਬਾ"},
 {pattern:"ਭਾਂ__",answer:"ਡੇ"},
 {pattern:"ਹੈ__ਨ",answer:"ਰਾ"},
 {pattern:"__ਠ",answer:"ਊ"},
 {pattern:"ਮਿਹਨ__",answer:"ਤ"},
 {pattern:"ਭ__",answer:"ਰਾ"},
 {pattern:"ਮਿੱ__",answer:"ਟੀ"},
 {pattern:"ਸ__ਰੇ",answer:"ਵੇ"},
 {pattern:"__ਥੀ",answer:"ਹਾ"},
 {pattern:"ਖੇਡ__",answer:"ਦੇ"}
]
];

let currentLevel=0;
let score=0;
let solved=0;
let audioCtx=null;

function makeSound(freq,dur,vol,type){
 if(!audioCtx){
   audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 }
 if(audioCtx.state==="suspended") audioCtx.resume();

 let osc=audioCtx.createOscillator();
 let gain=audioCtx.createGain();

 osc.frequency.value=freq;
 osc.type=type || "sine";
 gain.gain.value=vol || .1;

 osc.connect(gain);
 gain.connect(audioCtx.destination);

 osc.start();
 osc.stop(audioCtx.currentTime+dur);
}

function correctSound(){
 makeSound(750,.1,.09,"sine");
 setTimeout(()=>makeSound(980,.1,.08,"triangle"),80);
}

function wrongSound(){
 makeSound(90,.25,.22,"sawtooth");
 setTimeout(()=>makeSound(70,.22,.22,"sawtooth"),80);
 setTimeout(()=>makeSound(55,.25,.20,"square"),160);
 if(navigator.vibrate) navigator.vibrate([120,60,120]);
}

function sparkle(x,y){
 for(let i=0;i<14;i++){
  let s=document.createElement("div");
  s.className="spark";
  s.style.left=x+"px";
  s.style.top=y+"px";
  s.style.background=`hsl(${Math.random()*360},95%,55%)`;
  document.body.appendChild(s);

  let angle=Math.random()*Math.PI*2;
  let d=30+Math.random()*70;
  let dx=Math.cos(angle)*d;
  let dy=Math.sin(angle)*d;

  s.animate([
    {transform:"translate(0,0) scale(1)",opacity:1},
    {transform:`translate(${dx}px,${dy}px) scale(.2)`,opacity:0}
  ],{duration:750});

  setTimeout(()=>s.remove(),800);
 }
}

function splitWord(p){
 let m=p.match(/_+/);
 return [p.slice(0,m.index),p.slice(m.index+m[0].length)];
}

function options(ans){
 let allAnswers=[...new Set(levels.flat().map(x=>x.answer))];
 let pool=allAnswers.filter(x=>x!==ans);
 pool.sort(()=>Math.random()-0.5);
 return [ans,...pool.slice(0,3)].sort(()=>Math.random()-0.5);
}

function randomColor(){
 let h=Math.floor(Math.random()*360);
 return `linear-gradient(135deg,hsl(${h},100%,88%),hsl(${(h+60)%360},100%,76%))`;
}

function update(){
 let total=levels[currentLevel].length;
 document.getElementById("score").innerText="ਸਕੋਰ: "+score;
 document.getElementById("progress").innerText=solved+"/"+total;
 document.getElementById("bar").style.width=(solved/total*100)+"%";
}

function buildLevelButtons(){
 let box=document.getElementById("levelBtns");
 box.innerHTML="";
 levels.forEach((_,i)=>{
  let btn=document.createElement("button");
  btn.innerText="Level "+(i+1);
  if(i===currentLevel) btn.classList.add("active");
  btn.onclick=()=>{
    currentLevel=i;
    start();
    window.scrollTo({top:0,behavior:"smooth"});
  };
  box.appendChild(btn);
 });
}

function start(){
 score=0;
 solved=0;

 let words=levels[currentLevel];

 document.getElementById("levelPill").innerText="Level "+(currentLevel+1);
 document.getElementById("levelTitle").innerText="Level "+(currentLevel+1);
 document.getElementById("game").innerHTML="";
 document.getElementById("msg").innerText="Ready ✅";

 buildLevelButtons();
 update();

 words.forEach((w,i)=>{
  let parts=splitWord(w.pattern);

  let div=document.createElement("div");
  div.className="q";

  div.innerHTML=`
   <div class="qContent">
    <div class="word">
      ${i+1}. ${parts[0]} <span class="blank">_____</span> ${parts[1]}
    </div>
    <div class="choices"></div>
   </div>
  `;

  let blank=div.querySelector(".blank");
  let box=div.querySelector(".choices");

  options(w.answer).forEach(op=>{
   let btn=document.createElement("button");
   btn.className="chip";
   btn.innerText=op;
   btn.style.background=randomColor();

   btn.onclick=(e)=>{
    if(blank.dataset.done==="yes") return;

    if(op===w.answer){
      blank.innerText=op;
      blank.dataset.done="yes";
      blank.style.borderBottomColor="#00c853";

      btn.classList.add("good");
      box.querySelectorAll("button").forEach(b=>b.classList.add("used"));

      score+=10;
      solved++;
      correctSound();
      sparkle(e.clientX,e.clientY);
      document.getElementById("msg").innerText="ਸਹੀ ✅";
    }else{
      btn.classList.add("bad");
      score-=5;
      wrongSound();

      let lb=document.getElementById("levelBox");
      lb.classList.add("shake");
      setTimeout(()=>lb.classList.remove("shake"),300);

      document.getElementById("msg").innerText="ਗਲਤ ❌";
      setTimeout(()=>btn.classList.remove("bad"),500);
    }

    update();

    if(solved===words.length){
      document.getElementById("msg").innerText="Level Complete 🎉";
    }
   };

   box.appendChild(btn);
  });

  document.getElementById("game").appendChild(div);
 });
}

document.body.addEventListener("click",function(){
 if(!audioCtx){
   audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 }
},{once:true});

start();
</script>

</body>
</html>
